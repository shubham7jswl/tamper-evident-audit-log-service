spring:
  application:
    name: tamper-evident-audit-log-service
  datasource:
    url: jdbc:h2:file:./data/auditdb;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

logging:
  level:
    root: INFO
    com.sj.audit: INFO

audit:
  # SHA-256("tamper-evident-audit-log::genesis::v1"); prev_hash of the first record.
  genesis-hash: cdb3681748c47491bb74d81d0c8fb45444a52577331ee03b951cb2b9775fe0fa
  # Static API keys. No values are shipped here: supply high-entropy secrets via the env vars
  # below in every real environment. For local runs use the `dev` profile, which provides
  # well-known development keys (src/main/resources/application-dev.yml).
  # ApiKeyConfigValidator fails startup if a key is missing/placeholder and `dev` is not active.
  api-keys:
    - key: ${AUDIT_READER_KEY:}
      principal: reader
      scopes: [READ]
    - key: ${AUDIT_WRITER_KEY:}
      principal: writer
      scopes: [WRITE, READ]
    - key: ${AUDIT_ADMIN_KEY:}
      principal: admin
      scopes: [WRITE, READ, ADMIN]
  retention:
    enabled: true
    window: P365D
    scheduled: false
    scheduled-cron: "0 0 3 * * *"
  redaction:
    retain-salt-by-default: true
  export:
    # Optional HMAC over the export bundle. Empty => bundles are unsigned (integrity still
    # provable from the embedded hash-chain metadata).
    hmac-secret: ${AUDIT_EXPORT_HMAC_SECRET:}
  compliance:
    access-event-types:
      - ACCOUNT_VIEWED
      - ACCOUNT_STATEMENT_DOWNLOADED
      - ACCOUNT_SEARCHED
      - ACCOUNT_EXPORTED
    client-data-resource-types:
      - CLIENT_ACCOUNT
      - CLIENT_ACCOUNT_STATEMENT
